name: Release Plugin

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      bump:
        description: 'SemVer bump level for manual release'
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

concurrency:
  group: release-plugin
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Plan release
        id: plan
        run: |
          node scripts/release-plan.mjs \
            --event "${{ github.event_name }}" \
            --ref "${{ github.ref }}" \
            --bump "${{ inputs.bump }}" \
            --github-output "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v4
        if: steps.plan.outputs.should_release == 'true'
        with:
          version: 10

      - uses: actions/setup-node@v4
        if: steps.plan.outputs.should_release == 'true'
        with:
          node-version: 22
          cache: pnpm

      - name: Apply next release version
        if: steps.plan.outputs.should_release == 'true' && steps.plan.outputs.mode == 'auto'
        run: node scripts/release-plan.mjs --apply "${{ steps.plan.outputs.version }}"

      - name: Install, verify privacy, build, typecheck, and test
        if: steps.plan.outputs.should_release == 'true'
        run: |
          pnpm install
          pnpm run check:privacy
          pnpm build
          pnpm typecheck
          pnpm test

      - name: Pack plugin tarballs (versioned + latest alias) and checksums
        if: steps.plan.outputs.should_release == 'true'
        run: |
          node scripts/pack.mjs --out-dir .local/releases
          cd .local/releases
          sha256sum *.tgz > SHA256SUMS.txt
          ls -la

      - name: Commit and push version bump
        id: commit
        if: steps.plan.outputs.should_release == 'true' && steps.plan.outputs.mode == 'auto'
        env:
          RELEASE_TAG: ${{ steps.plan.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json packages/plugin/package.json packages/runtime/acp/package.json packages/runtime/codex/package.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): ${RELEASE_TAG} [skip ci]"
            git push origin HEAD:main
          fi
          echo "release_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release with .tgz assets
        if: steps.plan.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.plan.outputs.tag }}
          target_commitish: ${{ steps.commit.outputs.release_sha || github.sha }}
          name: ${{ steps.plan.outputs.tag }}
          make_latest: true
          generate_release_notes: true
          body: |
            ### 通过 GitHub Release `.tgz` 安装（无需构建脚本，始终指向最新版本）

            - **DSH 界面安装（Desktop / Web）**：在侧边栏 **插件 → 添加插件** 中直接填入：
              `https://github.com/harryzhz/dsh-external-agents/releases/latest/download/dsh-external-agents.tgz`
            - **CLI 安装（Web / Headless）**：
              ```bash
              dsh plugin --profile web add https://github.com/harryzhz/dsh-external-agents/releases/latest/download/dsh-external-agents.tgz
              ```
          files: |
            .local/releases/*.tgz
            .local/releases/SHA256SUMS.txt
